<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · Smite Blitz</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Mono&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--o:#f26a21;--bg:#0a0908;--p:#17100c;--l:#3b2a1e;--t:#fff8ef;--m:#a99687}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#451c09,transparent 32%),var(--bg);color:var(--t);font-family:Manrope}.wrap{max-width:1000px;margin:auto;padding:0 26px}nav{height:78px;border-bottom:1px solid #2b1e16;display:flex;align-items:center;justify-content:space-between}.brand{font:800 27px 'Barlow Condensed'}.brand span{color:var(--o)}a{color:var(--m);text-decoration:none;font-size:13px;font-weight:700;margin-left:25px}a.active{color:white}.hero{padding:55px 0 26px}.eyebrow{font:11px 'DM Mono';letter-spacing:1.6px;color:#ffad54}.hero h1{font:800 58px/.9 'Barlow Condensed';text-transform:uppercase;margin:12px 0}.hero p{font-size:13px;color:var(--m)}.layout{display:grid;grid-template-columns:330px 1fr;gap:22px;padding-bottom:45px}.card{background:linear-gradient(135deg,#1c120c,#100c0a);border:1px solid var(--l);border-radius:10px;padding:23px}.banner{height:108px;border-radius:7px;background:linear-gradient(115deg,#5c210b,#9b4313,#38201b);position:relative}.avatar{width:78px;height:78px;position:absolute;bottom:-34px;left:20px;border:3px solid #20130d;border-radius:50%;background:linear-gradient(135deg,#c4501d,#4f2017);display:grid;place-items:center;font:800 30px 'Barlow Condensed'}.who{margin-top:48px}.who h2{font:800 28px 'Barlow Condensed';margin:0}.who p{margin:4px 0;color:var(--m);font-size:12px}.rank{margin-top:23px;border-top:1px solid var(--l);padding-top:19px}.rank strong{display:block;color:#ffad54;font:800 24px 'Barlow Condensed'}.rank small{font:10px 'DM Mono';color:var(--m)}h3{font:800 28px 'Barlow Condensed';margin:0 0 22px;text-transform:uppercase}label{display:block;color:#b7a18e;font-size:11px;font-weight:700;margin:16px 0 7px}input{width:100%;background:#0d0a08;border:1px solid #513321;border-radius:5px;padding:12px;color:white;font:13px Manrope}.swatches{display:flex;gap:9px}.swatch{width:30px;height:30px;border:2px solid transparent;border-radius:50%;cursor:pointer}.swatch.active{border-color:white}.orange{background:#c74c18}.red{background:#a62f2a}.gold{background:#ad771b}.purple{background:#562c62}button{margin-top:25px;background:var(--o);border:0;border-radius:5px;padding:13px 18px;font:800 12px Manrope;color:#2c1106;cursor:pointer}.saved{color:#73d19e;font-size:11px;margin-left:12px;display:none}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero h1{font-size:48px}.wrap{padding:0 16px}nav a{margin-left:10px;font-size:11px}}</style></head><body><div class="wrap"><nav><div class="brand">SMITE<span>BLITZ</span></div><div><a href="index.html">Find Match</a><a href="leaderboard.html">Leaderboard</a><a href="history.html">Match History</a><a class="active" href="profile.html">Profile</a></div></nav><main><header class="hero"><div class="eyebrow">ACCOUNT SETTINGS</div><h1>Your profile</h1><p>Set up the identity your opponents see in the arena.</p></header><section class="layout"><aside class="card"><div class="banner"><div class="avatar" id="previewAvatar">N</div></div><div class="who"><h2 id="previewName">Neo Chat</h2><p>SMITE 2 DUELIST · #184 GLOBAL</p></div><div class="rank"><strong>1,842 MMR</strong><small>SEASON 1 · 42W / 19L</small></div></aside><section class="card"><h3>Edit profile</h3><label>DISPLAY NAME</label><input id="name" value="Neo Chat" maxlength="18" oninput="document.getElementById('previewName').textContent=this.value||'Neo Chat'"><label>PROFILE INITIAL</label><input id="initial" value="N" maxlength="1" oninput="document.getElementById('previewAvatar').textContent=this.value.toUpperCase()||'N'"><label>BANNER ACCENT</label><div class="swatches"><i class="swatch orange active" onclick="setAccent(this,'#c74c18')"></i><i class="swatch red" onclick="setAccent(this,'#a62f2a')"></i><i class="swatch gold" onclick="setAccent(this,'#ad771b')"></i><i class="swatch purple" onclick="setAccent(this,'#562c62')"></i></div><button onclick="document.getElementById('saved').style.display='inline'">SAVE CHANGES</button><span id="saved" class="saved">Saved successfully</span></section></section></main></div><script>function setAccent(el,color){document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelector('.banner').style.background='linear-gradient(115deg,'+color+',#7a3216,#38201b)'}</script></body></html>
