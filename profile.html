<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · Smite Blitz</title><style>@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@400;700;800&display=swap');:root{--o:#f26a21;--bg:#0a0908;--p:#17100c;--l:#3b2a1e;--t:#fff8ef;--m:#a99687}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#451c09,transparent 32%),var(--bg);color:var(--t);font-family:Manrope}.wrap{max-width:1000px;margin:auto;padding:0 26px}nav{height:78px;border-bottom:1px solid #2b1e16;display:flex;align-items:center;justify-content:space-between}.brand,h1,h2{font-family:'Barlow Condensed'}.brand{font-size:27px;font-weight:800}.brand span{color:var(--o)}a{color:var(--m);text-decoration:none;font-size:13px;font-weight:700;margin-left:25px}a.active{color:white}.hero{padding:54px 0 26px}.hero h1{font-size:58px;text-transform:uppercase;margin:8px 0}.hero p{font-size:13px;color:var(--m)}.layout{display:grid;grid-template-columns:330px 1fr;gap:22px;padding-bottom:45px}.card{background:linear-gradient(135deg,#1c120c,#100c0a);border:1px solid var(--l);border-radius:10px;padding:23px}.banner{height:108px;border-radius:7px;background:linear-gradient(115deg,#5c210b,#9b4313,#38201b);position:relative}.avatar{width:78px;height:78px;position:absolute;bottom:-34px;left:20px;border:3px solid #20130d;border-radius:50%;background:#c4501d center/cover;display:grid;place-items:center;font:800 30px 'Barlow Condensed';overflow:hidden}.who{margin-top:48px}.who h2{font-size:28px;margin:0}.who p{color:var(--m);font-size:12px}.rank{margin-top:23px;border-top:1px solid var(--l);padding-top:19px}.rank strong{display:block;color:#ffad54;font:800 24px 'Barlow Condensed'}small{font-size:10px;color:var(--m)}h2{font-size:28px;text-transform:uppercase;margin:0 0 22px}label{display:block;color:#b7a18e;font-size:11px;font-weight:700;margin:16px 0 7px}input{width:100%;background:#0d0a08;border:1px solid #513321;border-radius:5px;padding:12px;color:white}input[type=file]{color:#b7a18e}.swatches{display:flex;gap:9px}.swatch{width:30px;height:30px;border:2px solid transparent;border-radius:50%;cursor:pointer}.swatch.active{border-color:white}.orange{background:#c74c18}.red{background:#a62f2a}.gold{background:#ad771b}.purple{background:#562c62}button{margin-top:25px;background:var(--o);border:0;border-radius:5px;padding:13px 18px;font-weight:800;cursor:pointer}.saved{color:#73d19e;font-size:11px;margin-left:12px;display:none}@media(max-width:700px){.layout{grid-template-columns:1fr}.wrap{padding:0 16px}nav a{margin-left:10px;font-size:11px}}</style></head><body><div class="wrap"><nav><div class="brand">SMITE<span>BLITZ</span></div><div><a href="index.html">Find Match</a><a href="leaderboard.html">Leaderboard</a><a href="history.html">Match History</a><a class="active" href="profile.html">Profile</a></div></nav><main><header class="hero"><h1>Your profile</h1><p>Update your profile details.</p></header><section class="layout"><aside class="card"><div class="banner"><div class="avatar" id="avatar">N</div></div><div class="who"><h2 id="shownName">Neo Chat</h2><p>SMITE 2 DUELIST · #184 GLOBAL</p></div><div class="rank"><strong>1,842 MMR</strong><small>SEASON 1 · 42W / 19L</small></div></aside><section class="card"><h2>Edit profile</h2><label>DISPLAY NAME</label><input value="Neo Chat" oninput="shownName.textContent=this.value||'Neo Chat'"><label>PROFILE IMAGE</label><input type="file" accept="image/*" onchange="photo(event)"><label>BANNER ACCENT</label><div class="swatches"><i class="swatch orange active" onclick="accent(this,'#c74c18')"></i><i class="swatch red" onclick="accent(this,'#a62f2a')"></i><i class="swatch gold" onclick="accent(this,'#ad771b')"></i><i class="swatch purple" onclick="accent(this,'#562c62')"></i></div><button onclick="saved.style.display='inline'">SAVE CHANGES</button><span id="saved" class="saved">Saved successfully</span></section></section></main></div><script>function photo(e){let f=e.target.files[0];if(f){avatar.style.backgroundImage='url('+URL.createObjectURL(f)+')';avatar.textContent=''}}function accent(e,c){document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.querySelector('.banner').style.background='linear-gradient(115deg,'+c+',#7a3216,#38201b)'}</script></body></html>
